<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b4f5c">
<title>Lên Tour — Khám phá Việt Nam</title>
<meta name="description" content="Hàng trăm địa điểm ăn uống, cắm trại, săn mây và check-in được chọn lọc trên một bản đồ trực quan. Google Maps cho bạn biết đường đi. Lentour cho bạn biết nơi đáng để dừng chân.">
<meta property="og:title" content="Lên Tour — Khám phá Việt Nam">
<meta property="og:description" content="Bản đồ điểm đến, quán ăn và chỗ nghỉ dọc Việt Nam cho dân phượt.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Lên Tour">
<meta property="og:url" content="https://lentour.pages.dev/app/">
<meta property="og:locale" content="vi_VN">
<meta property="og:image" content="https://lentour.pages.dev/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://lentour.pages.dev/og-image.png">
<link rel="canonical" href="https://lentour.pages.dev/app/">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lên Tour">
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="stylesheet" href="lib/MarkerCluster.css">
<link rel="stylesheet" href="lib/MarkerCluster.Default.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://musbrsfduxvihlmomvvu.supabase.co" crossorigin>
<link rel="preload" as="script" href="lib/leaflet.js">
<link rel="preload" as="script" href="lib/leaflet.markercluster.js">
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin>
<link rel="preload" as="script" href="data.js">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@8..144,400..700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@8..144,400..700&display=swap"></noscript>
<style>
  :root{
    --sea:#2c3768;          /* chàm - header/thương hiệu */
    --sea-2:#2c3768;         /* chàm - cảnh đẹp + accent */
    --sun:#e0a12e;           /* hổ phách - lưu trú */
    --coral:#f2685c;         /* san hô - ăn uống */
    --moss:#e0a12e;          /* hổ phách - lưu trú */
    --ink:#1a2246;           /* chữ đậm (chàm đen) */
    --ink-soft:#5b6285;      /* chữ phụ */
    --paper:#ffffff;         /* nền trắng sạch */
    --card:#ffffff;
    --line:#e6e8f0;
    --shadow:0 2px 14px rgba(26,34,70,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Google Sans Flex',system-ui,sans-serif;
    background:var(--paper);color:var(--ink);
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  }

  /* ---------- Header ---------- */
  header{
    background:var(--sea);color:#fff;
    padding:14px 16px 14px 16px;
    padding-top:max(14px,env(safe-area-inset-top));
    flex-shrink:0;
  }
  .brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand-txt{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
  .brand h1{
    font-family:'Google Sans Flex',system-ui,sans-serif;
    font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1;
  }
  .brand .tag{font-size:12.5px;color:#aeb6e0;font-weight:500}

  /* ---------- Dải điểm dừng theo vùng (signature) ---------- */
  .ribbon-wrap{position:relative;margin-top:12px}
  .ribbon{
    display:flex;gap:0;overflow-x:auto;
    scrollbar-width:none;-ms-overflow-style:none;position:relative;
  }
  .ribbon::-webkit-scrollbar{display:none}
  .ribbon::before{
    content:"";position:absolute;top:13px;left:0;right:0;height:2px;
    background:rgba(174,182,224,.32);
  }
  /* gợi ý còn nội dung khi vuốt ngang */
  .ribbon-wrap::after{
    content:"";position:absolute;top:0;bottom:0;right:0;width:34px;pointer-events:none;
    background:linear-gradient(to right,transparent,var(--sea));
  }
  .stop{
    position:relative;flex:0 0 auto;padding:0 14px;text-align:center;
    background:none;border:0;color:#aeb6e0;cursor:pointer;font-family:inherit;
  }
  .stop .dot{
    width:12px;height:12px;border-radius:50%;background:#4b5589;
    border:2px solid var(--sea);margin:7px auto 6px;transition:.18s;
  }
  .stop .lbl{font-size:12px;font-weight:600;white-space:nowrap}
  .stop.on .dot{background:var(--sun);transform:scale(1.25)}
  .stop.on .lbl{color:#fff}

  /* ---------- Ô tìm kiếm ---------- */
  .searchbar{padding:12px 16px 2px;background:var(--paper);flex-shrink:0}
  .searchbar .box{
    display:flex;align-items:center;gap:9px;background:var(--card);
    border:1.5px solid var(--line);border-radius:13px;padding:11px 13px;
  }
  .searchbar .box:focus-within{border-color:var(--sea-2);box-shadow:0 0 0 3px rgba(14,124,134,.12)}
  .searchbar .ic{color:var(--ink-soft);font-size:15px;line-height:1}
  .searchbar input{
    flex:1;border:0;outline:0;background:none;font-family:inherit;
    font-size:14.5px;color:var(--ink);min-width:0;
  }
  .searchbar input::placeholder{color:var(--ink-soft)}
  .searchbar .clr{
    background:none;border:0;color:var(--ink-soft);cursor:pointer;display:none;
    width:40px;height:40px;place-items:center;padding:0;flex:0 0 auto;
  }
  .searchbar .clr.show{display:grid}

  /* ---------- Bộ lọc loại ---------- */
  .types{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;flex-shrink:0;
    scrollbar-width:none;background:var(--paper)}
  .types::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);
    color:var(--ink-soft);border-radius:999px;padding:8px 14px;font-size:13.5px;
    font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;
    transition:.15s;
  }
  .chip .sw{width:9px;height:9px;border-radius:50%}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* ---------- Sân khấu: bản đồ nền + tấm trượt ---------- */
  .stage{flex:1;position:relative;overflow:hidden}
  #map{position:absolute;inset:0;width:100%;height:100%;background:#cfe0e2}
  .map-btns{position:absolute;right:12px;top:12px;z-index:600;
    display:flex;flex-direction:column;gap:10px}
  .mbtn{
    width:48px;height:48px;border-radius:14px;border:0;cursor:pointer;
    box-shadow:var(--shadow);font-size:20px;display:grid;place-items:center;
    background:var(--card);color:var(--sea);
  }

  /* ---------- Tấm trượt (bottom sheet) ---------- */
  .sheet{position:absolute;left:0;right:0;bottom:0;height:92%;z-index:650;
    background:var(--paper);border-radius:20px 20px 0 0;
    box-shadow:0 -8px 30px rgba(26,34,70,.16);
    display:flex;flex-direction:column;
    transform:translateY(var(--sy,52%));transition:transform .28s ease}
  .sheet.full{--sy:4%}
  .handle{flex-shrink:0;padding:9px 0 5px;cursor:grab;touch-action:none}
  .handle::before{content:"";display:block;width:42px;height:5px;border-radius:3px;
    background:var(--line);margin:0 auto}
  .handle:active{cursor:grabbing}

  /* ---------- Danh sách ---------- */
  .list{flex:1;overflow-y:auto;padding:6px 12px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .totop{position:absolute;right:14px;bottom:calc(20px + env(safe-area-inset-bottom));width:46px;height:46px;
    border-radius:50%;background:var(--sea);color:#fff;border:0;place-items:center;cursor:pointer;
    box-shadow:0 6px 18px rgba(26,34,70,.4);z-index:6;display:none;opacity:0;transition:opacity .2s}
  .totop svg{width:22px;height:22px}
  .totop.show{display:grid;opacity:1}
  /* ===== Cung đường ===== */
  .tripbar{padding:2px 14px 0;flex-shrink:0}
  .tripbar[hidden]{display:none}
  .tb-main{width:100%;display:flex;align-items:center;gap:10px;background:var(--sea);color:#fff;
    border:0;border-radius:12px;padding:9px 12px;font-family:inherit;cursor:pointer;min-height:46px}
  .tb-main .ico{width:19px;height:19px;flex:none}
  .tb-txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;flex:1;text-align:left;min-width:0}
  .tb-txt b{font-size:13.5px;font-weight:700}
  .tb-txt span{font-size:11.5px;opacity:.78}
  .tb-cta{font-size:12.5px;font-weight:700;background:rgba(255,255,255,.18);padding:6px 11px;border-radius:999px;flex:none}
  .act.trip.on{background:var(--sea);color:#fff;border-color:var(--sea)}
  .act:disabled{opacity:.45;cursor:not-allowed}
  .tpin{width:26px;height:26px;border-radius:50%;background:var(--sea);color:#fff;border:2.5px solid #fff;
    display:grid;place-items:center;font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .pop-trip{margin-top:8px;width:100%;border:1.5px solid var(--line);background:#fff;color:var(--sea);
    border-radius:8px;padding:7px 10px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
  .pop-trip.on{background:var(--sea);color:#fff;border-color:var(--sea)}
  .tsum{font-size:13px;color:var(--ink-soft);margin:2px 0 10px}
  .tsum b{color:var(--ink);font-size:16px}
  .tlist{max-height:44vh;overflow-y:auto;margin:0 -2px}
  .trow{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--line)}
  .trow:last-child{border-bottom:0}
  .tnum{width:25px;height:25px;border-radius:50%;background:var(--sea);color:#fff;font-size:12px;
    font-weight:700;display:grid;place-items:center;flex:none}
  .tname{flex:1;min-width:0}
  .tname b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tname span{font-size:11.5px;color:var(--ink-soft)}
  .tbtns{display:flex;gap:4px;flex:none}
  .tbtn{width:36px;height:36px;border:1.5px solid var(--line);background:#fff;border-radius:8px;
    display:grid;place-items:center;cursor:pointer;color:var(--sea);font-size:13px;font-family:inherit}
  .tbtn:disabled{opacity:.32;cursor:not-allowed}
  .tbtn.del{color:#c0392b;border-color:#e6c3bd}
  .tacts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}
  .tact{padding:12px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;min-height:46px;
    border:1.5px solid var(--line);background:#fff;color:var(--sea);font-family:inherit}
  .tact.primary{background:var(--sea);color:#fff;border-color:var(--sea)}
  .tact.primary:disabled{opacity:.45}
  .tact.danger{color:#c0392b;border-color:#e6c3bd}
  .tnote{font-size:11px;color:var(--ink-soft);margin-top:11px;line-height:1.5}
  .count{font-size:12.5px;color:var(--ink-soft);padding:8px 4px 4px;font-weight:600}
  .listfoot{margin:14px 4px 6px;padding-top:12px;border-top:1px solid var(--line);
    font-size:11px;line-height:1.6;color:var(--ink-soft);opacity:.85}
  .hdr-acts{display:flex;gap:7px;flex:0 0 auto}
  a.fbbtn.hdr{text-decoration:none;display:flex;align-items:center}
  .fbbtn.hdr{flex:0 0 auto;white-space:nowrap;background:rgba(255,255,255,.12);
    border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 15px;min-height:38px;
    font-family:inherit;font-size:12.5px;font-weight:700;color:#fff;cursor:pointer}
  .fbbtn.hdr:hover{background:rgba(255,255,255,.2)}
  .fb-overlay{position:fixed;inset:0;background:rgba(8,30,36,.55);display:grid;place-items:center;z-index:2000;padding:16px}
  .fb-modal{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
  .fb-modal h3{font-family:'Google Sans Flex',sans-serif;font-size:18px;color:var(--sea);margin-bottom:12px}
  .fb-modal label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin:10px 0 4px}
  .fb-modal input,.fb-modal select,.fb-modal textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;font-size:14px}
  .fb-foot{display:flex;gap:10px;margin-top:18px}
  .fb-btn{flex:1;border:0;border-radius:10px;padding:12px 18px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer}
  .fb-btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--sea)}
  .fb-btn.send{background:var(--sea-2);color:#fff}
  @keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card{
    animation:cardIn .3s ease both;
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;
    border-left:5px solid var(--sea-2);
  }
  .card .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .card h2{font-size:16.5px;font-weight:700;line-height:1.25}
  .card .prov{font-size:12px;color:var(--ink-soft);margin-top:2px;font-weight:500}
  .badge{flex:0 0 auto;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;
    color:#fff;white-space:nowrap;letter-spacing:.01em}
  .card .note{font-size:13px;color:var(--ink-soft);margin-top:8px;line-height:1.5}
  .card .thumbs{display:flex;gap:6px;margin-top:9px}
  .card .thumbs img{width:78px;height:58px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#eef4f4}
  .acts{flex-wrap:wrap;display:flex;gap:8px;margin-top:12px}
  .act{
    flex:1;text-align:center;text-decoration:none;font-weight:600;font-size:13.5px;
    padding:11px;border-radius:11px;font-family:inherit;border:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .act.dir{background:var(--sea);color:#fff}
  .act.call{background:#fff;color:var(--moss);border:1.5px solid var(--moss)}
  .act.viewmap{flex:0 0 auto;background:#fff;color:var(--sea);border:1.5px solid var(--sea)}
  .act:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

  /* ---------- Trạng thái rỗng ---------- */
  .empty{text-align:center;color:var(--ink-soft);padding:40px 24px;font-size:14px;line-height:1.6}
  .empty .big{font-size:30px;display:block;margin-bottom:10px}
  .empty button{
    margin-top:16px;background:var(--sea);color:#fff;border:0;border-radius:11px;
    padding:11px 20px;font-family:inherit;font-weight:600;font-size:13.5px;cursor:pointer;
  }

  /* toast */
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;
    z-index:1200;opacity:0;transition:.25s;pointer-events:none;max-width:88%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
  .pin{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center}
  .pin{color:#fff}
  .pin span{transform:rotate(45deg);line-height:0}
  .ico{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;flex:0 0 auto}
  .act .ico{width:17px;height:17px}
  .prov .ico{width:13px;height:13px;vertical-align:-0.12em;opacity:.7}
  .nearbar .ico{width:14px;height:14px;vertical-align:-0.15em}
  .ic .ico{width:19px;height:19px;color:#8aa0a2}
  .clr .ico{width:14px;height:14px}
  .mbtn .ico{width:23px;height:23px}
  .empty .big .ico{width:42px;height:42px}
  .pin span .ico{width:15px;height:15px}
  .nearbar{display:block;width:100%;margin:0 0 8px;padding:8px 12px;border-radius:10px;
    border:1.5px solid var(--sea);background:rgba(14,124,134,.08);color:var(--sea);
    font-family:inherit;font-weight:600;font-size:12.5px;cursor:pointer;text-align:left}
  .marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background:rgba(14,124,134,.30)}
  /* --- a11y & touch (rà soát skill) --- */
  .stop,.chip,.act{min-height:44px}
  .stop,.chip,.act,.mbtn,.searchbar .clr,.handle{touch-action:manipulation}
  .stop:focus-visible,.chip:focus-visible,.searchbar .clr:focus-visible,
  .mbtn:focus-visible,.handle:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:10px}
  .marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{
    background:var(--sea-2);color:#fff;font-family:'Google Sans Flex';font-weight:700}
  .leaflet-popup-content{font-family:'Google Sans Flex';font-size:14px;font-weight:600;margin:10px 12px}
  @media (max-width:480px){
    header{padding:11px 14px}
    header{padding-top:max(11px,env(safe-area-inset-top))}
    .brand h1{font-size:22px}
    .brand .tag{display:none}                 /* mô tả dài — thừa trong app, ẩn cho gọn */
    .ribbon-wrap{margin-top:9px}
    .fbbtn.hdr{padding:7px 11px;min-height:38px;font-size:11.5px}
    .hdr-acts{gap:6px}
    .card{padding:13px;margin-bottom:9px;border-radius:14px}
    .card .note{margin-top:6px}
    .card .thumbs img{width:70px;height:52px}
    .acts{margin-top:10px;gap:7px}
    .act{padding:10px;font-size:13px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-txt">
      <h1>Lên Tour</h1>
      <span class="tag">Bắc · Trung · Nam — cẩm nang phượt dọc Việt Nam</span>
    </div>
    <div class="hdr-acts">
      <a class="fbbtn hdr" href="chia-tien/" title="Chia tiền nhóm sau chuyến đi">Chia tiền</a>
      <button type="button" class="fbbtn hdr" id="fbBtn" title="Báo điểm sai / gợi ý điểm mới">Góp ý</button>
    </div>
  </div>
  <div class="ribbon-wrap"><div class="ribbon" id="ribbon"></div></div>
</header>

<div class="stage">
  <div id="map"></div>
  <div class="map-btns">
    <button class="mbtn" id="locate" title="Vị trí của tôi" aria-label="Về vị trí của tôi"><svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
  <section class="sheet" id="sheet">
    <div class="handle" id="handle" role="button" tabindex="0" aria-label="Kéo hoặc bấm để mở rộng danh sách"></div>
    <div class="tripbar" id="tripbar" hidden>
      <button type="button" class="tb-main" id="tbOpen">
        <svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M9 19h4a3 3 0 0 0 0-6h-2a3 3 0 0 1 0-6h4"/></svg>
        <span class="tb-txt"><b id="tbCount">0 điểm</b><span id="tbKm"></span></span>
        <span class="tb-cta">Xem cung</span>
      </button>
    </div>
    <div class="searchbar">
      <div class="box">
        <span class="ic"><svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
        <input id="q" type="search" inputmode="search" autocomplete="off"
               aria-label="Tìm điểm đến" placeholder="Tìm điểm, món ăn, tỉnh…">
        <button class="clr" id="qclr" aria-label="Xoá tìm kiếm"><svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
    </div>
    <div class="types" id="types"></div>
    <div class="list" id="list"></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script src="lib/leaflet.js"></script>
<script src="lib/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data.js"></script>
<script>
/* Dữ liệu TYPE, PROVINCES, PLACES được nạp từ data.js */

/* ---------- State ---------- */
let activeProv = null;   // null = tất cả vùng
let activeType = 'all';
let activeQuery = '';
let markers = [];
let meMarker = null;
let cluster = null;
let userPos = null;     // [lat,lng] vị trí người dùng
let nearMode = false;   // sắp danh sách theo khoảng cách

const HOME_VIEW = [[18.6,105.8], 5];   // tâm + zoom mặc định (bao cả nước)

/* ---------- Map ---------- */
let map=null;
try{
  if(typeof L==='undefined') throw new Error('Leaflet chưa tải');
  map = L.map('map',{zoomControl:false}).setView(HOME_VIEW[0],HOME_VIEW[1]);
  L.control.zoom({position:'topleft'}).addTo(map);
  const _origCreateTile = L.TileLayer.prototype.createTile;
  L.TileLayer.prototype.createTile = function(coords, done){
    const tile = _origCreateTile.call(this, coords, done);
    tile.setAttribute('fetchpriority','high');
    return tile;
  };
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19, attribution:'© OpenStreetMap'
  }).addTo(map);
  if(typeof L.markerClusterGroup==='function'){
    cluster=L.markerClusterGroup({maxClusterRadius:48,showCoverageOnHover:false,
      spiderfyOnMaxZoom:true,chunkedLoading:true});
    map.addLayer(cluster);
  }
}catch(e){
  const mw=document.querySelector('.map-wrap');
  if(mw) mw.innerHTML='<div style="padding:18px;font-size:13.5px;color:var(--ink-soft);'+
    'background:#fff;border-bottom:1px solid var(--line)"><svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg> Chưa tải được bản đồ '+
    '(kiểm tra mạng). Danh sách điểm bên dưới vẫn dùng bình thường.</div>';
}

const TYPE_ICON={view:`<svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>`,food:`<svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>`,stay:`<svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg>`};
function pin(t){
  const color=(TYPE[t]||{}).color||'#0e7c86';
  return L.divIcon({
    className:'',
    html:`<div class="pin" style="background:${color}"><span>${TYPE_ICON[t]||''}</span></div>`,
    iconSize:[28,28], iconAnchor:[14,26], popupAnchor:[0,-24]
  });
}
function haversine(a,b){
  const R=6371,dLat=(b[0]-a[0])*Math.PI/180,dLng=(b[1]-a[1])*Math.PI/180;
  const s=Math.sin(dLat/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
const fmtKm=d=>d<10?d.toFixed(1)+' km':Math.round(d)+' km';

const provName=k=>{const p=PROVINCES.find(x=>x.key===k);return p?p.name:k;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Dải vùng: 'Tất cả' + các tỉnh ---------- */
const ribbon = document.getElementById('ribbon');
function buildRibbon(){
 ribbon.innerHTML='';
 [{key:'',name:'Tất cả'}, ...PROVINCES].forEach(pv=>{
  const b=document.createElement('button');
  b.className='stop'; b.dataset.k=pv.key;
  b.innerHTML=`<div class="dot"></div><div class="lbl">${pv.name}</div>`;
  b.onclick=()=>{
    activeProv = pv.key==='' ? null : (activeProv===pv.key ? null : pv.key);
    if(activeQuery) setQuery('');           // chọn vùng thì thoát tìm kiếm
    focusProvince();
    setSheet('peek');
    render();
  };
  ribbon.appendChild(b);
 });
}

/* ---------- Bộ lọc loại ---------- */
const typesEl=document.getElementById('types');
function buildTypes(){
 typesEl.innerHTML='';
 const allTypes=[['all','Tất cả',null],...Object.entries(TYPE).map(([k,v])=>[k,v.label,v.color])];
 allTypes.forEach(([k,lbl,color])=>{
  const c=document.createElement('button');
  c.className='chip'+(k==='all'?' on':''); c.dataset.k=k;
  c.innerHTML=(color?`<span class="sw" style="background:${color}"></span>`:'')+lbl;
  c.onclick=()=>{activeType=k; render();};
  typesEl.appendChild(c);
 });
}

/* ---------- Tìm kiếm ---------- */
const qEl=document.getElementById('q');
const qClr=document.getElementById('qclr');
function setQuery(v){
  qEl.value=v;
  activeQuery=v.trim().toLowerCase();
  qClr.classList.toggle('show', !!v);
}
let qDebounce;
qEl.addEventListener('input',()=>{
  qClr.classList.toggle('show', !!qEl.value);   // nút xoá hiện ngay
  clearTimeout(qDebounce);
  qDebounce=setTimeout(()=>{
    activeQuery=qEl.value.trim().toLowerCase();
    if(activeQuery) activeProv=null;            // tìm kiếm là tìm toàn quốc
    render();
  },150);
});
qClr.onclick=()=>{ setQuery(''); render(); qEl.focus(); };

/* ---------- Lấy danh sách theo bộ lọc ---------- */
function filtered(){
  return PLACES.filter(p=>{
    if(activeType!=='all' && p.t!==activeType) return false;
    if(activeQuery){
      const hay=(p.n+' '+(p.note||'')+' '+provName(p.p)).toLowerCase();
      return hay.includes(activeQuery);
    }
    if(activeProv && p.p!==activeProv) return false;
    return true;
  });
}

/* ---------- Bản đồ: ngắm vừa khít vùng đang chọn ---------- */
function focusProvince(){
  if(!map) return;
  if(!activeProv){ map.flyTo(HOME_VIEW[0],HOME_VIEW[1],{duration:.7}); return; }
  const pts=PLACES.filter(p=>p.p===activeProv && p.ll).map(p=>p.ll);
  if(pts.length>=2){
    map.flyToBounds(pts,{padding:[44,44],maxZoom:12,duration:.7});
  }else{
    map.flyTo(pts[0]||PROVINCES.find(x=>x.key===activeProv).c, 10,{duration:.7});
  }
}

/* ---------- Render ---------- */
const listEl=document.getElementById('list');
function flyToPlace(p){
  if(!(p.ll && map)) return;
  const mk=markers.find(m=>m._place===p);
  setSheet('peek');
  if(cluster && mk){ cluster.zoomToShowLayer(mk,()=>mk.openPopup()); }
  else { map.flyTo(p.ll,12,{duration:.7}); if(mk) mk.openPopup(); }
  setTimeout(()=>{ const st=sheet.parentElement.clientHeight; map.panBy([0, st*0.20]); },380);
}
function mapsHref(pl){
  return pl.map || 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(pl.n+' Việt Nam');
}
function render(){
  if(isDeep()) armBack();
  document.querySelectorAll('.stop').forEach(s=>
    s.classList.toggle('on',(s.dataset.k||'')===(activeProv||'')));
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.k===activeType));

  const items=filtered();
  if(nearMode && userPos){
    items.forEach(p=>p._d = p.ll ? haversine(userPos,p.ll) : Infinity);
    items.sort((a,b)=>a._d-b._d);
  }

  // markers
  if(map){
    if(cluster) cluster.clearLayers(); else markers.forEach(m=>map.removeLayer(m));
    markers=[];
    items.filter(p=>p.ll).forEach(p=>{
      const dkm=(nearMode&&userPos)?` · cách ~${fmtKm(haversine(userPos,p.ll))}`:'';
      const _sl=slugify(p.n);
      const m=L.marker(p.ll,{icon:pin(p.t)}).bindPopup(
        `<b>${esc(p.n)}</b><br><span style="color:${TYPE[p.t].color}">${TYPE[p.t].label}</span>${dkm}`+
        `<button type="button" class="pop-trip${inTrip(p)?' on':''}" data-sl="${_sl}">${inTrip(p)?'✓ Đã trong cung':'+ Thêm vào cung'}</button>`);
      m._place=p; markers.push(m);
      if(cluster) cluster.addLayer(m); else m.addTo(map);
    });
  }

  // trạng thái rỗng
  if(items.length===0){
    listEl.innerHTML=`<div class="empty"><span class="big"><svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg></span>
      Chưa có điểm nào khớp bộ lọc.<br>Thử bỏ bớt bộ lọc hoặc đổi từ khoá.
      <br><button id="reset">Xoá bộ lọc</button></div>`;
    document.getElementById('reset').onclick=()=>{
      activeProv=null; activeType='all'; setQuery('');
      focusProvince(); render();
    };
    return;
  }

  // dòng đếm
  let label=`${items.length} điểm`;
  if(activeQuery) label=`${items.length} kết quả cho “${esc(activeQuery)}”`;
  else{
    if(activeProv) label+=` · ${provName(activeProv)}`;
    if(activeType!=='all') label+=` · ${TYPE[activeType].label}`;
  }
  const nearBar=(nearMode&&userPos)?
    `<button id="nearoff" class="nearbar"><svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg> Đang sắp theo khoảng cách từ bạn · Tắt</button>`:'';
  listEl.innerHTML=`<div class="count">${label}</div>${nearBar}`+
    `<div class="cardhost" id="cardhost"></div><div id="sentinel" aria-hidden="true" style="height:1px"></div>`+`<p class="listfoot">Vị trí chỉ dùng trên máy bạn, không gửi đi đâu. · Thông tin có thể thay đổi — hãy kiểm tra trước khi đi. · Dữ liệu bản đồ © OpenStreetMap.<br><a href="chia-tien/" style="color:var(--sea);font-weight:700">Chia tiền nhóm sau chuyến đi →</a></p>`;
  requestAnimationFrame(()=>{ listEl.scrollTop=0; });
  const noff=document.getElementById('nearoff');
  if(noff) noff.onclick=()=>{ nearMode=false; render(); };
  _vitems=items; _vcount=0; renderMore();
  if(_io) _io.disconnect();
  _io=new IntersectionObserver(es=>{ if(es[0].isIntersecting) renderMore(); },{root:listEl,rootMargin:'400px'});
  const _sen=document.getElementById('sentinel'); if(_sen) _io.observe(_sen);
}

/* ---------- Danh sách ảo hoá: dựng theo lô khi cuộn ---------- */
let _vitems=[], _vcount=0, _io=null; const BATCH=24;
function renderMore(){
  const host=document.getElementById('cardhost'); if(!host) return;
  const end=Math.min(_vcount+BATCH,_vitems.length);
  for(let i=_vcount,j=0;i<end;i++,j++) host.appendChild(buildCard(_vitems[i],j));
  _vcount=end;
  if(_vcount>=_vitems.length){ const s=document.getElementById('sentinel'); if(s) s.style.display='none'; if(_io) _io.disconnect(); }
}
function buildCard(p,j){
    const card=document.createElement('div');
    card.className='card'; card.style.borderLeftColor=TYPE[p.t].color;
    card.style.animationDelay=(Math.min(j,12)*0.025)+'s';
    card.innerHTML=`
      <div class="top">
        <div>
          <h2>${esc(p.n)}</h2>
          <div class="prov"><svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg> ${provName(p.p)}${(nearMode&&userPos&&p.ll)?` · <b style="color:var(--sea)">cách ~${fmtKm(p._d)}</b>`:''}</div>
        </div>
        <span class="badge" style="background:${TYPE[p.t].color}">${TYPE[p.t].label}</span>
      </div>
      ${p.note?`<div class="note">${esc(p.note)}</div>`:''}
      ${(p.img&&p.img.length)?`<div class="thumbs">${p.img.slice(0,3).map(u=>`<img src="${esc(u)}" alt="" loading="lazy">`).join('')}</div>`:''}
      <div class="acts">
        <button type="button" class="act trip${inTrip(p)?' on':''}" data-sl="${slugify(p.n)}"${p.ll?'':' disabled'} aria-label="Thêm ${esc(p.n)} vào cung đường"><svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg> <span class="tlbl">${inTrip(p)?'Trong cung':'Cung'}</span></button>
        ${p.ll&&map?`<button type="button" class="act viewmap" aria-label="Xem ${esc(p.n)} trên bản đồ"><svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg> Bản đồ</button>`:''}
        <a class="act dir" href="${mapsHref(p)}" target="_blank" rel="noopener"><svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg> Chỉ đường</a>
        ${p.tel?`<a class="act call" href="tel:${p.tel}"><svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.2 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.9.36 1.78.7 2.6a2 2 0 0 1-.45 2.11L8.09 9.9a16 16 0 0 0 6 6l1.47-1.27a2 2 0 0 1 2.11-.45c.82.34 1.7.57 2.6.7A2 2 0 0 1 22 16.92z"/></svg> ${esc(p.tel)}</a>`:''}
      </div>`;
    card.querySelector('.acts').addEventListener('click',e=>e.stopPropagation());
    const vm=card.querySelector('.viewmap');
    if(vm) vm.onclick=e=>{ e.stopPropagation(); flyToPlace(p); };
    const tb=card.querySelector('.act.trip');
    if(tb && !tb.disabled) tb.onclick=e=>{ e.stopPropagation(); toggleTripBySlug(tb.dataset.sl); };
    card.onclick=()=>{
      if(p.ll && map) flyToPlace(p);
      else if(!map) toast('Bản đồ chưa sẵn sàng — bấm Chỉ đường để mở Maps.');
      else toast('Điểm này chưa gắn toạ độ — bấm Chỉ đường để mở Maps.');
    };
    return card;
}

/* ---------- Vị trí của tôi ---------- */
document.getElementById('locate').onclick=()=>{
  if(!map){toast('Bản đồ chưa sẵn sàng.');return;}
  if(!navigator.geolocation){toast('Thiết bị không hỗ trợ định vị.');return;}
  toast('Đang lấy vị trí…');
  navigator.geolocation.getCurrentPosition(
    pos=>{
      const ll=[pos.coords.latitude,pos.coords.longitude];
      userPos=ll;
      if(meMarker) map.removeLayer(meMarker);
      meMarker=L.circleMarker(ll,{radius:9,color:'#fff',weight:3,
        fillColor:'#1b7be0',fillOpacity:1}).addTo(map).bindPopup('Bạn ở đây');
      nearMode=true; activeProv=null;
      render(); setSheet('peek');
      map.flyTo(ll,11,{duration:.8}); meMarker.openPopup();
      toast('Đã sắp các điểm theo khoảng cách từ bạn.');
    },
    ()=>toast('Chưa bật được định vị. Trên bản chạy thật (HTTPS) sẽ hỏi quyền và chạy ngon.'),
    {enableHighAccuracy:true,timeout:8000}
  );
};

/* ---------- Tấm trượt ---------- */
const sheet=document.getElementById('sheet');
const handle=document.getElementById('handle');
function setSheet(state){ sheet.classList.toggle('full', state==='full'); if(state==='full') armBack(); }
(function(){
  let dragging=false,startY=0,startTy=0,stageH=0,moved=false;
  const curTy=()=>{ const m=getComputedStyle(sheet).transform;
    const t=(m&&m!=='none')?m.match(/matrix.*\((.+)\)/):null;
    return t?(parseFloat(t[1].split(', ')[5])||0):0; };
  const toggle=()=> setSheet(sheet.classList.contains('full')?'peek':'full');
  function down(e){ dragging=true; moved=false; startY=e.clientY;
    stageH=sheet.parentElement.clientHeight; startTy=curTy();
    sheet.style.transition='none'; try{handle.setPointerCapture(e.pointerId);}catch(_){ } }
  function move(e){ if(!dragging) return;
    const dy=e.clientY-startY; if(Math.abs(dy)>6) moved=true;
    const ty=Math.max(stageH*0.04, Math.min(stageH*0.52, startTy+dy));
    sheet.style.transform='translateY('+ty+'px)'; }
  function up(){ if(!dragging) return; dragging=false;
    const ty=curTy(); sheet.style.transition=''; sheet.style.transform='';
    if(!moved) toggle(); else setSheet(ty<stageH*0.28?'full':'peek'); }
  handle.addEventListener('pointerdown',down);
  handle.addEventListener('pointermove',move);
  handle.addEventListener('pointerup',up);
  handle.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();} });
})();

/* Cuộn danh sách -> tự bung full màn (khỏi phải kéo panel trước) + nút về đầu */
(function(){
  const toTop=document.createElement('button');
  toTop.className='totop'; toTop.type='button';
  toTop.setAttribute('aria-label','Về đầu danh sách');
  toTop.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>';
  sheet.appendChild(toTop);
  toTop.addEventListener('click',()=>{ listEl.scrollTo({top:0,behavior:'smooth'}); });
  listEl.addEventListener('scroll',()=>{
    if(listEl.scrollTop>6 && !sheet.classList.contains('full')) setSheet('full');
    toTop.classList.toggle('show', listEl.scrollTop>500);
  },{passive:true});
})();

/* ---------- Toast ---------- */
let tT;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(tT); tT=setTimeout(()=>el.classList.remove('show'),3000);
}

/* ---------- Nút Back của điện thoại: lùi một cấp thay vì thoát ---------- */
let _armed=false;
function isDeep(){ return !!(activeProv || (activeType && activeType!=='all') || activeQuery || nearMode); }
function armBack(){ if(!_armed){ try{ history.pushState({t:1},''); _armed=true; }catch(_){ } } }
window.addEventListener('popstate',()=>{
  _armed=false;
  if(sheet.classList.contains('full')){ setSheet('peek'); if(isDeep()) armBack(); return; }
  if(activeQuery){ setQuery(''); render(); return; }
  if(activeType && activeType!=='all'){ activeType='all'; render(); return; }
  if(activeProv){ activeProv=null; render(); return; }
  if(nearMode){ nearMode=false; render(); return; }
});

/* ================= CUNG ĐƯỜNG ================= */
const TRIP_KEY='docbo_trip', TRIP_MAX=25, GMAPS_MAX=11;
let trip=[], tripLayer=null;

const slugify=x=>String(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[đĐ]/g,'d').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const placeBySlug=sl=>PLACES.find(p=>slugify(p.n)===sl);
const tripPlaces=()=>trip.map(placeBySlug).filter(Boolean);
const inTrip=p=>trip.indexOf(slugify(p.n))>=0;

function saveTrip(){ try{ localStorage.setItem(TRIP_KEY,JSON.stringify(trip)); }catch(_){} }
function loadTrip(){ try{ const t=JSON.parse(localStorage.getItem(TRIP_KEY)||'[]'); if(Array.isArray(t)) trip=t.filter(x=>typeof x==='string'); }catch(_){} }
function pruneTrip(){ const n=trip.length; trip=trip.filter(sl=>{const p=placeBySlug(sl); return p&&p.ll;}); if(trip.length!==n) saveTrip(); }

function tripDist(list){ let d=0; for(let i=1;i<list.length;i++) d+=haversine(list[i-1].ll,list[i].ll); return d; }

function toggleTripBySlug(sl){
  const p=placeBySlug(sl); if(!p) return;
  if(!p.ll){ toast('Điểm chưa có toạ độ — chưa thêm vào cung được.'); return; }
  const i=trip.indexOf(sl);
  if(i>=0){ trip.splice(i,1); toast('Đã bỏ khỏi cung'); }
  else{
    if(trip.length>=TRIP_MAX){ toast('Cung tối đa '+TRIP_MAX+' điểm.'); return; }
    trip.push(sl); toast('Đã thêm vào cung · '+trip.length+' điểm');
  }
  saveTrip(); paintTrip();
}

function syncTripButtons(){
  document.querySelectorAll('.act.trip').forEach(b=>{
    const on=trip.indexOf(b.dataset.sl)>=0;
    b.classList.toggle('on',on);
    const l=b.querySelector('.tlbl'); if(l) l.textContent=on?'Trong cung':'Cung';
  });
  document.querySelectorAll('.pop-trip').forEach(b=>{
    const on=trip.indexOf(b.dataset.sl)>=0;
    b.classList.toggle('on',on);
    b.textContent=on?'✓ Đã trong cung':'+ Thêm vào cung';
  });
}

function paintTrip(){
  const list=tripPlaces(), bar=document.getElementById('tripbar');
  if(bar){
    if(!list.length) bar.hidden=true;
    else{
      bar.hidden=false;
      document.getElementById('tbCount').textContent=list.length+' điểm trong cung';
      document.getElementById('tbKm').textContent = list.length>1
        ? '~'+fmtKm(tripDist(list))+' · đường chim bay'
        : 'Thêm điểm nữa để thành cung';
    }
  }
  if(map){
    if(!tripLayer) tripLayer=L.layerGroup().addTo(map);
    tripLayer.clearLayers();
    const pts=list.map(p=>p.ll);
    if(pts.length>1) L.polyline(pts,{color:'#2c3768',weight:3.5,opacity:.85,dashArray:'7 8'}).addTo(tripLayer);
    list.forEach((p,i)=>{
      L.marker(p.ll,{zIndexOffset:1000,icon:L.divIcon({className:'',
        html:'<div class="tpin">'+(i+1)+'</div>',iconSize:[26,26],iconAnchor:[13,13]})})
        .bindPopup('<b>'+esc(p.n)+'</b><br>Chặng '+(i+1)+' / '+list.length).addTo(tripLayer);
    });
  }
  syncTripButtons();
}

function moveStop(i,d){ const j=i+d; if(j<0||j>=trip.length) return; const t=trip[i]; trip[i]=trip[j]; trip[j]=t; saveTrip(); paintTrip(); }
function sortTripNS(){
  const ord={}; PROVINCES.forEach((p,i)=>ord[p.key]=i);
  const list=tripPlaces();
  list.sort((a,b)=>(ord[a.p]??99)-(ord[b.p]??99) || String(a.n).localeCompare(b.n,'vi'));
  trip=list.map(p=>slugify(p.n)); saveTrip(); paintTrip(); toast('Đã sắp theo hướng Bắc → Nam');
}
function tripMapsUrl(list){
  if(list.length<2) return null;
  const cap=list.slice(0,GMAPS_MAX);
  const o=cap[0].ll, d=cap[cap.length-1].ll;
  const wp=cap.slice(1,-1).map(p=>p.ll.join(',')).join('|');
  let u='https://www.google.com/maps/dir/?api=1&travelmode=driving'+
        '&origin='+o.join(',')+'&destination='+d.join(',');
  if(wp) u+='&waypoints='+encodeURIComponent(wp);
  return u;
}
function exportGPX(list){
  if(!list.length) return;
  const xmlEsc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
  const tripName=trip.length?('Cung đường Dọc Bờ ('+list.length+' điểm)'):'Cung đường Dọc Bờ';
  const wpts=list.map(p=>
    `  <wpt lat="${p.ll[0]}" lon="${p.ll[1]}">\n`+
    `    <name>${xmlEsc(p.n)}</name>\n`+
    `    <desc>${xmlEsc(provName(p.p)+(p.note?' — '+p.note:''))}</desc>\n`+
    `  </wpt>`).join('\n');
  const rtepts=list.map(p=>
    `    <rtept lat="${p.ll[0]}" lon="${p.ll[1]}"><name>${xmlEsc(p.n)}</name></rtept>`).join('\n');
  const gpx=`<?xml version="1.0" encoding="UTF-8"?>\n`+
    `<gpx version="1.1" creator="Dọc Bờ — lentour.pages.dev" xmlns="http://www.topografix.com/GPX/1/1">\n`+
    `  <metadata><name>${xmlEsc(tripName)}</name></metadata>\n`+
    wpts+`\n`+
    `  <rte>\n    <name>${xmlEsc(tripName)}</name>\n`+rtepts+`\n  </rte>\n`+
    `</gpx>\n`;
  const slug=tripName.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[đĐ]/g,'d').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase();
  const blob=new Blob([gpx],{type:'application/gpx+xml'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(slug||'cung-duong')+'.gpx';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Đã xuất GPX — mở bằng Maps.me, OsmAnd hay Google Earth');
}
async function shareTrip(){
  const url=tripShareUrl();
  if(navigator.share){ try{ await navigator.share({title:'Cung đường Khám phá Việt Nam',url}); return; }catch(_){ return; } }
  try{ await navigator.clipboard.writeText(url); toast('Đã chép link cung đường'); }
  catch(_){ window.prompt('Chép link cung đường:', url); }
}

function renderTripPanel(ov){
  const list=tripPlaces(), n=list.length;
  ov.innerHTML=`<div class="fb-modal">
    <h3>Cung đường</h3>
    <div class="tsum">${n} điểm${n>1?` · <b>~${fmtKm(tripDist(list))}</b> đường chim bay`:''}</div>
    <div class="tlist">${ n? list.map((p,i)=>`
      <div class="trow">
        <span class="tnum">${i+1}</span>
        <span class="tname"><b>${esc(p.n)}</b><span>${provName(p.p)}</span></span>
        <span class="tbtns">
          <button type="button" class="tbtn" data-mv="up" data-i="${i}" ${i===0?'disabled':''} aria-label="Chuyển lên">↑</button>
          <button type="button" class="tbtn" data-mv="down" data-i="${i}" ${i===n-1?'disabled':''} aria-label="Chuyển xuống">↓</button>
          <button type="button" class="tbtn del" data-rm="${i}" aria-label="Bỏ khỏi cung">✕</button>
        </span>
      </div>`).join('')
      : '<div style="padding:14px 0;color:var(--ink-soft);font-size:13.5px">Chưa có điểm nào. Bấm nút <b>Cung</b> trên thẻ điểm để thêm.</div>' }</div>
    ${n?`<div class="tacts">
      <button type="button" class="tact" id="tSort">Sắp Bắc → Nam</button>
      <button type="button" class="tact" id="tShare">Chia sẻ cung</button>
      <button type="button" class="tact primary" id="tMaps" ${n<2?'disabled':''}>Mở Google Maps</button>
      <button type="button" class="tact" id="tGpx">Xuất GPX</button>
      <button type="button" class="tact danger" id="tClear">Xoá cung</button>
      <a class="tact" href="chia-tien/" style="grid-column:1/-1;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center">Chia tiền cho chuyến này →</a>
    </div>`:''}
    <p class="tnote">Khoảng cách là đường chim bay — chỉ để ước lượng, quãng chạy thật sẽ dài hơn. Google Maps nhận tối đa ${GMAPS_MAX} chặng. Cung lưu trong máy bạn, không gửi đi đâu.</p>
    <div class="fb-foot"><button type="button" class="fb-btn ghost" id="tClose">Đóng</button></div>
  </div>`;
  ov.querySelector('#tClose').onclick=()=>{ ov.style.display='none'; };
  ov.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{ moveStop(+b.dataset.i, b.dataset.mv==='up'?-1:1); renderTripPanel(ov); });
  ov.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ trip.splice(+b.dataset.rm,1); saveTrip(); paintTrip(); renderTripPanel(ov); });
  const bs=ov.querySelector('#tSort');  if(bs) bs.onclick=()=>{ sortTripNS(); renderTripPanel(ov); };
  const bh=ov.querySelector('#tShare'); if(bh) bh.onclick=shareTrip;
  const bm=ov.querySelector('#tMaps');  if(bm) bm.onclick=()=>{ const u=tripMapsUrl(tripPlaces()); if(!u) return;
    if(tripPlaces().length>GMAPS_MAX) toast('Google Maps chỉ nhận '+GMAPS_MAX+' chặng — mở '+GMAPS_MAX+' điểm đầu.');
    window.open(u,'_blank','noopener'); };
  const bg=ov.querySelector('#tGpx'); if(bg) bg.onclick=()=>exportGPX(tripPlaces());
  const bc=ov.querySelector('#tClear'); if(bc) bc.onclick=()=>{ if(confirm('Xoá toàn bộ cung đường?')){ trip=[]; saveTrip(); paintTrip(); renderTripPanel(ov); } };
}
function openTrip(){
  let ov=document.getElementById('tripOverlay');
  if(!ov){
    ov=document.createElement('div'); ov.id='tripOverlay'; ov.className='fb-overlay';
    document.body.appendChild(ov);
    ov.addEventListener('mousedown',e=>{ if(e.target===ov) ov.style.display='none'; });
    document.addEventListener('keydown',e=>{ if(e.key==='Escape' && ov.style.display!=='none') ov.style.display='none'; });
  }
  ov.style.display='grid'; renderTripPanel(ov);
}
const _tbOpen=document.getElementById('tbOpen'); if(_tbOpen) _tbOpen.onclick=openTrip;
document.addEventListener('click',e=>{
  const b=e.target.closest?e.target.closest('.pop-trip'):null;
  if(b&&b.dataset.sl){ e.preventDefault(); toggleTripBySlug(b.dataset.sl); }
});

loadTrip();
(function(){
  const c=new URLSearchParams(location.search).get('cung');
  if(!c) return;
  const inc=c.split(',').map(x=>x.trim()).filter(Boolean).slice(0,TRIP_MAX);
  if(!inc.length) return;
  trip=inc; saveTrip();
  // dọn ?cung khỏi URL: tải lại trang sẽ không ghi đè cung bạn vừa sửa
  try{ history.replaceState(history.state,'',location.pathname); }catch(_){}
  setTimeout(()=>toast('Đã mở cung đường được chia sẻ'),700);
})();

  let ov=document.getElementById('fbOverlay');
  if(ov){ ov.style.display='grid'; return; }
  ov=document.createElement('div'); ov.id='fbOverlay'; ov.className='fb-overlay';
  ov.innerHTML=`<div class="fb-modal">
    <h3>Góp ý cho Lên Tour</h3>
    <label>Loại</label>
    <select id="fbKind">
      <option value="sai">Báo điểm sai / đã đóng cửa</option>
      <option value="moi">Gợi ý điểm mới</option>
      <option value="gopy">Góp ý khác</option>
    </select>
    <label>Tên điểm (nếu có)</label>
    <input id="fbName" placeholder="VD: Quán bún cá X, Nha Trang">
    <label>Nội dung *</label>
    <textarea id="fbMsg" rows="3" placeholder="Mô tả giúp mình…"></textarea>
    <label>Liên hệ (không bắt buộc)</label>
    <input id="fbContact" placeholder="email/sđt nếu muốn được phản hồi">
    <div class="fb-foot">
      <button type="button" class="fb-btn ghost" id="fbCancel">Đóng</button>
      <button type="button" class="fb-btn send" id="fbSend">Gửi</button>
    </div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('mousedown',e=>{ if(e.target===ov) ov.style.display='none'; });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape' && ov.style.display!=='none') ov.style.display='none'; });
  ov.querySelector('#fbCancel').onclick=()=>ov.style.display='none';
  ov.querySelector('#fbSend').onclick=async()=>{
    const msg=ov.querySelector('#fbMsg').value.trim();
    if(!msg){ toast('Hãy nhập nội dung góp ý'); return; }
    if(!sbClient){ toast('Cần mạng để gửi góp ý'); return; }
    const btn=ov.querySelector('#fbSend'); btn.disabled=true;
    const payload={ kind:ov.querySelector('#fbKind').value,
      place_name:ov.querySelector('#fbName').value.trim()||null,
      message:msg, contact:ov.querySelector('#fbContact').value.trim()||null };
    const res=await sbClient.from('suggestions').insert(payload);
    btn.disabled=false;
    if(res.error){ toast('Lỗi gửi: '+res.error.message); return; }
    ov.querySelector('#fbMsg').value=''; ov.querySelector('#fbName').value=''; ov.querySelector('#fbContact').value='';
    ov.style.display='none'; toast('Đã gửi góp ý — cảm ơn bạn!');
  };
}
document.addEventListener('click',e=>{ if(e.target && e.target.id==='fbBtn') openFeedback(); });

// 1) Có cache gần nhất -> vẽ ngay (mở nhanh, đúng bản mới nhất kể cả khi offline)
try{
  const c=JSON.parse(localStorage.getItem('docbo_cache')||'null');

// 2) Có mạng -> tải bản mới nhất từ Supabase rồi cập nhật
async function loadFromSupabase(){
  if(!sbClient) return;
  try{
    const sb=sbClient;
    const [pl,pv,tp]=await Promise.all([
      sb.from('places').select('name,type,province,lat,lng,note,tel,map_url,images').eq('status','published'),
      sb.from('provinces').select('key,name,center_lat,center_lng,sort_order').order('sort_order'),
      sb.from('types').select('key,label,color'),
    ]);
    if(pl.error||pv.error||tp.error) return;
    if(!pl.data || !pl.data.length) return;
    PLACES = pl.data.map(r=>({ n:r.name, t:r.type, p:r.province,
      ll:(r.lat!=null && r.lng!=null)?[r.lat,r.lng]:undefined,
      note:r.note||undefined, tel:r.tel||undefined, map:r.map_url||undefined,
      img:(Array.isArray(r.images)&&r.images.length)?r.images:undefined }));
    PROVINCES = pv.data.map(r=>({ key:r.key, name:r.name, c:[r.center_lat, r.center_lng] }));
    const T={}; tp.data.forEach(r=>T[r.key]={label:r.label, color:r.color}); TYPE=T;
    sortByProvince();
    try{ localStorage.setItem('docbo_cache', JSON.stringify({PLACES,PROVINCES,TYPE})); }catch(_){}
    paintAll();
  }catch(_){ /* offline -> giữ bản dự phòng */ }
}
loadFromSupabase();
